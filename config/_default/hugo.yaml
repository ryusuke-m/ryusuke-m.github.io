# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Website name (set in params.yaml under hugoblox.branding.name)
title: ''
# Website URL
baseURL: 'https://ryusuke-m.github.io/'

############################
## LANGUAGE
############################

defaultContentLanguage: ja
hasCJKLanguage: true
defaultContentLanguageInSubdir: false
removePathAccents: true


############################
## PAGE OPTIONS
############################

cascade:
  - target:
      path: /slides/**
      kind: page
    outputs: [HTML, present]
  # Hugo Blox template sample content: keep out of the sitemap and search results (noindex)
  - target:
      path: '{/courses,/courses/**}'
    sitemap:
      disable: true
    noindex: true
  - target:
      path: '{/blog,/blog/**}'
    sitemap:
      disable: true
    noindex: true
  - target:
      path: '{/events,/events/**}'
    sitemap:
      disable: true
    noindex: true
  - target:
      path: '{/events.backup,/events.backup/**}'
    sitemap:
      disable: true
    noindex: true
  - target:
      path: '{/slides,/slides/**}'
    sitemap:
      disable: true
    noindex: true

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
disableAliases: true
outputs:
  home: [HTML, RSS, headers, redirects, backlinks]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture
timeout: 600000
taxonomies:
  author: authors
  tag: tags
  publication_type: publication_types
markup:
  _merge: deep
  highlight:
    lineNos: false
security:
  _merge: deep
  exec:
    allow:
      - '^(dart-)?sass$'
      - '^go$'
      - '^git$'
      - '^node$'
      - '^postcss$'
      - '^tailwindcss$'
sitemap:
  _merge: deep
